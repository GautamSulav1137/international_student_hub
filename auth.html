
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | International Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">🌏</div>

        <h1>International Student Hub</h1>
        <p class="auth-subtitle">Your companion for student life in South Korea</p>

        <div class="auth-tabs">
            <button id="login-tab" class="active" onclick="showLogin()">
                Login
            </button>
            <button id="register-tab" onclick="showRegister()">
                Register
            </button>
        </div>

        <!-- LOGIN FORM -->

        <form id="login-form">

            <h2>Welcome Back!</h2>
            <p>Sign in to your student account.</p>

            <label for="login-email">Email Address</label>
            <input
                type="email"
                id="login-email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="login-password">Password</label>
            <input
                type="password"
                id="login-password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="auth-submit">
                Login
            </button>

            <div id="login-message" class="auth-message"></div>

        </form>

        <!-- REGISTRATION FORM -->

        <form id="register-form" class="hidden">

            <h2>Create Your Account</h2>
            <p>Join the International Student Hub.</p>

            <label for="register-name">Full Name</label>
            <input
                type="text"
                id="register-name"
                placeholder="Enter your full name"
                autocomplete="name"
                maxlength="80"
                required
            >

            <label for="register-email">Email Address</label>
            <input
                type="email"
                id="register-email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="register-university">University</label>
            <select id="register-university" required>
                <option value="">Select your university</option>
                <option value="Kyungsung University">Kyungsung University</option>
                <option value="Pusan National University">Pusan National University</option>
                <option value="Dong-A University">Dong-A University</option>
                <option value="Other">Other</option>
            </select>

            <label for="register-password">Password</label>
            <input
                type="password"
                id="register-password"
                placeholder="At least 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Enter your password again"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="auth-submit">
                Create Account
            </button>

            <div id="register-message" class="auth-message"></div>

        </form>

        <p class="auth-footer">
            Capstone Design 1 | Team Vertex
        </p>

    </div>

    <script src="auth.js"></script>

</body>
</html>
